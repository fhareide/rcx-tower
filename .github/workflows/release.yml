name: Release

# Builds the Windows exe, both Mac dmgs and the Linux tar.gz.
#
# Pushing a `v*` tag releases that version, with its CHANGELOG.md section as the note:
#   git tag v0.3.0 && git push origin v0.3.0
# By hand, from the Actions tab or with:
#   gh workflow run release.yml -R fhareide/rcx-tower --ref main
# A run by hand only builds: the apps are kept as workflow artifacts, nothing is released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag pushed again (say, moved to a rewritten commit) for a version that is already
  # released builds nothing.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is already released: nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows.exe
          - os: macos-latest       # Apple silicon
            asset: mac-arm64.dmg
          - os: macos-15-intel     # Intel
            asset: mac-x86_64.dmg
          # The oldest supported Ubuntu runner, so the program runs on older glibc versions too.
          - os: ubuntu-22.04
            asset: linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        run: |
          src="$(python -c 'import rcxtower; print(rcxtower.__version__)')"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            v="${GITHUB_REF_NAME#v}"
            if [[ "$v" != "$src" ]]; then
              echo "::error::tag $GITHUB_REF_NAME but rcxtower/__init__.py says $src"
              exit 1
            fi
          else
            v="$src-$(git rev-parse --short HEAD)"
          fi
          echo "ASSET=RCX-Tower-$v-${{ matrix.asset }}" >> "$GITHUB_ENV"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m pip install --quiet pyinstaller
          call build_exe.bat || exit /b 1
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flex bison xvfb > /dev/null
          chmod +x build_linux.sh
          ./build_linux.sh
      - name: NQC build log
        if: always() && runner.os != 'Windows'
        run: tail -n 40 build/nqc-build.log || true
      - name: Window self-test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 3
        run: '"dist/RCX Tower.app/Contents/MacOS/RCX Tower" gui --selftest'
      - name: Window self-test (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 3
        run: xvfb-run -a dist/rcx-tower gui --selftest

      - name: Collect
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Windows) cp "dist/RCX Tower.exe" "out/$ASSET" ;;
            macOS) cp dist/*.dmg "out/$ASSET" ;;
            Linux) cp dist/*.tar.gz "out/$ASSET" ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: out/${{ env.ASSET }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            .github/release-notes.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            sh .github/release-notes.sh "$v"
            echo; echo "---"; echo
            echo "Downloads: **Windows** \`RCX-Tower-$v-windows.exe\`, **macOS** \`RCX-Tower-$v-mac-arm64.dmg\` (Apple silicon) or \`RCX-Tower-$v-mac-x86_64.dmg\` (Intel), **Linux** \`RCX-Tower-$v-linux-x86_64.tar.gz\`. First start (SmartScreen / Gatekeeper, tower driver): see [Download](https://github.com/$GITHUB_REPOSITORY#download) in the README."
          } > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "RCX Tower $v" --notes-file notes.md --latest
