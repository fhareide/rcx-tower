# The apps: Windows .exe, macOS .dmg for Apple silicon and for Intel.
#
# Releases are automatic: bump `__version__` in rcxtower/__init__.py, add its `## <version>`
# section to CHANGELOG.md, and push to main. When no release v<version> exists yet, the apps
# are built and published as that release, with the CHANGELOG section as its note. A new
# version without a CHANGELOG section stops before anything is built. Other pushes build
# nothing. Run it by hand from the Actions tab to build without releasing (files under the
# run's Artifacts, kept a day).
#
# A release is made as a draft first and each build attaches its file to it directly. The
# release job then writes the note and publishes it. A run that fails part-way leaves the
# draft; running it again reuses it (files are replaced).
#
# Public downloads: with the RELEASES_TOKEN secret set (a fine-grained token with
# Contents: read and write on PUBLIC_REPO), every release is also published there with the
# same files and note, so people can download the apps without access to this repository.
# Its "Source code" archives hold only that repo's README: the release job checks that
# before publishing and stops if there is anything else.
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import rcxtower; print(rcxtower.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = push ] && ! gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ -z "$(sh .github/release-notes.sh "$version")" ]; then
              echo "::error::CHANGELOG.md has no '## $version' section: write the release note for v$version first"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version is new: building and releasing"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # the release, as a draft the builds attach their files to (one left by a failed run is reused)
  draft:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - run: |
          if gh release list --repo "${{ github.repository }}" --json tagName,isDraft \
               --jq ".[] | select(.isDraft and .tagName == \"v$VERSION\")" | grep -q .; then
            echo "Reusing the draft of v$VERSION"
          else
            gh release create "v$VERSION" --repo "${{ github.repository }}" --draft \
              --target "${{ github.sha }}" --title "RCX Tower $VERSION" --notes "Building…"
          fi

  build:
    needs: [version, draft]
    if: >-
      always() && needs.version.result == 'success' && needs.draft.result != 'failure' &&
      (needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows.exe
          - os: macos-latest       # Apple silicon
            asset: mac-arm64.dmg
          - os: macos-15-intel     # Intel
            asset: mac-x86_64.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      ASSET: RCX-Tower-${{ needs.version.outputs.version }}-${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m pip install --quiet pyinstaller
          call build_exe.bat || exit /b 1
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
      - name: NQC build log
        if: always() && runner.os == 'macOS'
        run: tail -n 40 build/nqc-build.log || true
      - name: Window self-test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 3
        run: '"dist/RCX Tower.app/Contents/MacOS/RCX Tower" gui --selftest'
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then cp "dist/RCX Tower.exe" "out/$ASSET"; else cp dist/*.dmg "out/$ASSET"; fi
          ls -la out
      - name: Attach to the draft release
        if: needs.version.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.version.outputs.version }}" "out/$ASSET" --clobber --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4  # a build by hand, without a release
        if: needs.version.outputs.release != 'true'
        with:
          name: ${{ env.ASSET }}
          path: out/${{ env.ASSET }}
          retention-days: 1

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLIC_REPO: fhareide/rcx-tower-releases
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4  # for CHANGELOG.md
        with:
          sparse-checkout: |
            CHANGELOG.md
            .github/release-notes.sh
          sparse-checkout-cone-mode: false
      - name: The files the builds attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --dir out --repo "${{ github.repository }}"
      - name: Release notes
        run: |
          mkdir -p notes
          sh .github/release-notes.sh "$VERSION" > notes/changes.md
          downloads="Downloads: **Windows** \`RCX-Tower-$VERSION-windows.exe\`, **macOS** \`RCX-Tower-$VERSION-mac-arm64.dmg\` (Apple silicon) or \`RCX-Tower-$VERSION-mac-x86_64.dmg\` (Intel)."
          { cat notes/changes.md; echo; echo "---"; echo; echo "$downloads See the README for first-start notes (SmartScreen / Gatekeeper, tower driver)."; } > notes/private.md
          { cat notes/changes.md; echo; echo "---"; echo; echo "$downloads First start (SmartScreen / Gatekeeper, tower driver): see the README on the repo's front page."; } > notes/public.md
          cat notes/public.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="v$VERSION" -f target_commitish="${{ github.sha }}" --jq .body > notes/commits.md
          { cat notes/private.md; echo; cat notes/commits.md; } > notes/release.md
          gh release edit "v$VERSION" --repo "${{ github.repository }}" --title "RCX Tower $VERSION" \
            --notes-file notes/release.md --draft=false --latest
      # GitHub adds "Source code" archives of the tag to every release and they can't be
      # turned off, so the public tag must point at a commit that holds only the README.
      - name: Check that the public release holds no source code
        if: env.RELEASES_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          check_tree() {
            extra=$(gh api "repos/$PUBLIC_REPO/git/trees/$1?recursive=1" --jq '.tree[].path' | grep -vx 'README.md' || true)
            if [ -n "$extra" ]; then
              echo "::error::$PUBLIC_REPO $1 holds more than README.md, so its Source code archives would too:"
              echo "$extra"
              exit 1
            fi
          }
          check_tree main
          if gh api "repos/$PUBLIC_REPO/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            check_tree "v$VERSION"
          fi
          expected=$(printf '%s\n' "RCX-Tower-$VERSION-mac-arm64.dmg" "RCX-Tower-$VERSION-mac-x86_64.dmg" "RCX-Tower-$VERSION-windows.exe")
          actual=$(ls out | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::out/ should hold only the three apps, but holds:"
            echo "$actual"
            exit 1
          fi
      - name: Publish the downloads in the public repo
        if: env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ env.RELEASES_TOKEN }}
          tag_name: v${{ env.VERSION }}
          target_commitish: main  # the public repo's README commit, never this repo's
          name: RCX Tower ${{ env.VERSION }}
          make_latest: true
          body_path: notes/public.md
          files: out/*
